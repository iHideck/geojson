[project]
name = "geojson-boundaries"
version = "0.0.0"
description = "日本と世界の境界データを作る道具"
requires-python = ">=3.14"
dependencies = [
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pycountry>=26.2.16",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
