<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Midnight Chart — 日本と世界の境界</title>
    <meta name="description" content="日本の陸と海の境界を、同じ基準で重ねて見られる地図。データは GeoJSON・GeoPackage・PMTiles などで配っています。" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b1733" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Midnight Chart — Japan & World Boundaries" />
    <meta property="og:description" content="Lightweight GeoJSON boundaries for Japan and the world, with an interactive map viewer and GIS-ready downloads." />
    <meta property="og:url" content="https://ihideck.github.io/geojson/" />
    <meta property="og:image" content="https://ihideck.github.io/geojson/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="map"></div>
    <canvas id="frame" aria-hidden="true"></canvas>

    <figure class="fallback">
      <img data-src="og.jpg" width="1200" height="630" alt="日本の周りの境界の地図（静止画）" />
      <figcaption data-t="noWebgl"></figcaption>
    </figure>

    <header class="topbar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13.5" fill="none" stroke="currentColor" stroke-width="1" />
          <path d="M16 3 L18.2 16 L16 29 L13.8 16 Z" fill="currentColor" opacity=".85" />
          <path d="M3 16 L16 14.4 L29 16 L16 17.6 Z" fill="currentColor" opacity=".45" />
        </svg>
        <div>
          <h1 class="brand-title" data-t="title">MIDNIGHT CHART</h1>
          <p class="brand-sub" data-t="subtitle">日本と世界の陸と海の境界</p>
        </div>
      </div>
      <button class="menu-button" type="button" aria-expanded="false" aria-controls="tools" data-t-label="openMenu">
        <span></span><span></span><span></span>
      </button>
      <div class="tools" id="tools">
        <div class="search" role="search">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4" />
            <path d="M13 13 L17.5 17.5" stroke="currentColor" stroke-width="1.4" />
          </svg>
          <input id="search" type="search" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" autocomplete="off" data-t-label="searchLabel" data-t-placeholder="search" />
          <ul id="search-results" role="listbox" hidden></ul>
        </div>
        <nav class="menu" data-t-label="menu">
          <button type="button" data-dialog="data" data-t="data">データ</button>
          <button type="button" data-dialog="howto" data-t="howto">使い方</button>
          <button type="button" data-dialog="license" data-t="license">ライセンス</button>
          <span class="lang" role="group" data-t-label="language">
            <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </span>
        </nav>
      </div>
    </header>

    <aside class="panel" id="panel" aria-labelledby="panel-title">
      <button class="sheet-handle" type="button" aria-expanded="true" aria-controls="panel" data-t-label="sheet"></button>
      <div class="panel-head">
        <h2 id="panel-title"><span data-t="layers">凡例</span><span class="en" data-t="layersEn">LAYERS</span></h2>
      </div>
      <ul class="layers"></ul>
      <div class="res"></div>
      <p class="credits"></p>
    </aside>

    <button class="compass" id="compass" type="button" data-t-label="northUp">
      <svg viewBox="-50 -50 100 100" aria-hidden="true">
        <circle r="44" fill="none" stroke="currentColor" stroke-width="1" opacity=".5" />
        <g class="needle">
          <path d="M0 -38 L6 0 L0 38 L-6 0 Z" fill="currentColor" opacity=".35" />
          <path d="M0 -38 L6 0 L-6 0 Z" fill="#f3b35b" />
          <text y="-24" text-anchor="middle" font-size="11" fill="currentColor">N</text>
        </g>
      </svg>
    </button>

    <footer class="readout">
      <div class="ro ro-pos"><span class="k" data-t="position">位置</span><span class="v" id="ro-pos">—</span></div>
      <div class="ro ro-zoom"><span class="k" data-t="zoom">ズーム</span><span class="v" id="ro-zoom">—</span></div>
      <div class="ro ro-scale">
        <span class="k" data-t="scale">縮尺</span><span class="v" id="ro-scale">—</span>
        <canvas id="scalebar" width="124" height="10" aria-hidden="true"></canvas><span class="bar-label" id="scalebar-label"></span>
      </div>
    </footer>

    <p class="disclaimer" role="note">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" />
        <path d="M8 7v4.2M8 4.6v.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      <span class="long" data-t="disclaimer">境界は法的な境界を示しません。航海など安全に関わる用途には使えません。</span>
      <span class="short" data-t="disclaimerShort">法的な境界ではありません。航海には使えません。</span>
    </p>

    <aside class="card" id="card" aria-live="polite" aria-labelledby="card-name" hidden></aside>
    <button class="skip" id="skip" type="button" hidden><span data-t="skip">演出をスキップ</span> <kbd>Esc</kbd></button>
    <p class="status" id="status" role="alert" hidden></p>
    <dialog class="dialog" id="dialog"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
