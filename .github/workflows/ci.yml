name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint・単体テスト・リポジトリの決まり
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # アクションは供給網攻撃への対策として、タグではなくコミットの SHA に固定する
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: make lint
      - run: make test
