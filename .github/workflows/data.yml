name: データ

# 道具のイメージやデータを作る処理が変わったときと、週1回、データを作り直して検査する
on:
  pull_request:
    paths:
      - Dockerfile
      - Makefile
      - layers.yml
      - sources/**
      - scripts/**
      - schemas/**
      - data/**
      - docs/size-report.md
      - tests/**
      - mk/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/data.yml
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 道具のイメージを作り、make build を動かす
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # tippecanoe のビルドを毎回しないように、イメージの層を Actions のキャッシュに置く
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: geojson-tools:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 国土数値情報だけで 800MB あるので、取得した元データを台帳の内容ごとにキャッシュする。古いものは SHA256 の照合で取り直す
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('sources/*.yml') }}
          restore-keys: sources-
      - name: イメージの中で make build-in-image を動かす
        run: mkdir -p .cache && docker run --rm -v "$PWD":/work -v "$PWD/.cache":/cache -e GEOJSON_CACHE=/cache -w /work -u "$(id -u):$(id -g)" -e HOME=/tmp geojson-tools:local make build-in-image
      # 作り直した data/ とサイズの報告が、git に入っているものと同じなら、make build で再現できている
      - name: 作り直した結果が git のものと同じか確かめる
        run: |
          git status --porcelain -- data docs/size-report.md
          git diff --exit-code -- data docs/size-report.md
          test -z "$(git status --porcelain -- data docs/size-report.md)"
