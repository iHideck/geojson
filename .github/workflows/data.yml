name: データとビューア

# 道具のイメージ・データを作る処理・ビューアが変わったときと、週1回、データを作り直して、データとビューアを検査する
on:
  pull_request:
    paths:
      - Dockerfile
      - Makefile
      - layers.yml
      - sources/**
      - scripts/**
      - schemas/**
      - data/**
      - docs/size-report.md
      - styles/**
      - site/**
      - tests/**
      - mk/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/data.yml
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
  # リリースとデプロイのワークフローが呼ぶ。upload のときは、作った配布物を artifact で渡す
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 配布物を渡すときは、ほかの実行に止められないよう、実行ごとの組にする
  group: ${{ inputs.upload && format('data-upload-{0}', github.run_id) || format('data-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 道具のイメージを作り、make build を動かす
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # tippecanoe のビルドを毎回しないように、イメージの層を Actions のキャッシュに置く
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: geojson-tools:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 国土数値情報だけで 800MB あるので、取得した元データを台帳の内容ごとにキャッシュする。古いものは SHA256 の照合で取り直す
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/sources
          key: sources-${{ hashFiles('sources/*.yml') }}
          restore-keys: sources-
      - name: イメージの中で make build-in-image を動かす
        run: mkdir -p .cache && docker run --rm -v "$PWD":/work -v "$PWD/.cache":/cache -e GEOJSON_CACHE=/cache -w /work -u "$(id -u):$(id -g)" -e HOME=/tmp geojson-tools:local make build-in-image
      - name: リリースの QGIS プロジェクトを、QGIS の長期版と最新版で開いて描く
        run: make check-qgis
      # 作り直した data/・サイズの報告・スタイルが、git に入っているものと同じなら、make build で再現できている
      - name: 作り直した結果が git のものと同じか確かめる
        run: |
          git status --porcelain -- data docs/size-report.md styles
          git diff --exit-code -- data docs/size-report.md styles
          test -z "$(git status --porcelain -- data docs/size-report.md styles)"
      # 公開するレイヤーのファイルだけが入る（tests/test_formats.py と tests/test_leaks.py で確かめている）
      - name: リリースのファイルを渡す
        if: inputs.upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/release
          retention-days: 1
      # ビューアの検査（下の site）と、デプロイ（pages.yml）が使う
      - name: GitHub Pages のデータを渡す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages
          path: dist/pages
          retention-days: 1

  site:
    name: ビューアを、作ったデータで確かめる（ブラウザ・見た目・Lighthouse・大きさ）
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 見た目の比べる元の画面（site/tests/*-snapshots）を撮ったのと同じイメージで動かす
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
    env:
      CI: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pages
          path: dist/pages
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - name: 初めに読む JS と CSS の大きさを、予算と比べる
        run: npm run budget --prefix site
      - name: ブラウザで、PMTiles の表示・操作・見た目を確かめる（PC とスマートフォンの幅）
        run: npx playwright test
        working-directory: site
      - name: Lighthouse で、LCP（PC 2.5 秒、スマートフォン 4 秒）とアクセシビリティを確かめる
        working-directory: site
        run: |
          CHROME_PATH=$(node -e 'console.log(require("@playwright/test").chromium.executablePath())') npm run lighthouse
      - name: 落ちたときの画面と報告を残す
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-report
          # 見た目の元の画面が無いときや変わったときは、site/tests の下に実際の画面が書かれる
          path: |
            playwright-report
            test-results
            .lighthouseci
            site/tests/*-snapshots
          retention-days: 7
