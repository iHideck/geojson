name: データ

# 道具のイメージやデータを作る処理が変わったときと、週1回、データを作り直して検査する
on:
  pull_request:
    paths:
      - Dockerfile
      - Makefile
      - mk/**
      - package.json
      - package-lock.json
      - pyproject.toml
      - uv.lock
      - .github/workflows/data.yml
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 道具のイメージを作り、make build を動かす
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # tippecanoe のビルドを毎回しないように、イメージの層を Actions のキャッシュに置く
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: geojson-tools:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: イメージの中で make build-in-image を動かす
        run: docker run --rm -v "$PWD":/work -w /work -u "$(id -u):$(id -g)" -e HOME=/tmp geojson-tools:local make build-in-image
