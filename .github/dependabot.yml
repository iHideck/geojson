version: 2
updates:
  # 依存の更新は週1回。PR が増えないよう、種類ごとに1つにまとめる
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
    groups:
      npm:
        patterns: ['*']
  # ビューア（MapLibre・PMTiles・Vite）
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
    groups:
      site:
        patterns: ['*']
    # Node の型は、動かす Node（site/.node-version と Dockerfile の 24 系）と同じ大きな版にとどめる
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
    groups:
      python:
        patterns: ['*']
  # データを作る道具のイメージ（GDAL・uv）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
    groups:
      docker:
        patterns: ['*']
  # GitHub Actions（SHA で固定しているので、更新はここで受け取る）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "cron"
      cronjob: "0 0 1,15 * *"
    groups:
      github-actions:
        patterns: ['*']
