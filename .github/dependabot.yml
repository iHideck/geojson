version: 2
updates:
  # 依存の更新は週1回。PR が増えないよう、種類ごとに1つにまとめる
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
  # ビューア（MapLibre・PMTiles・Vite）
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    groups:
      site:
        patterns: ['*']
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ['*']
  # データを作る道具のイメージ（GDAL・uv）
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ['*']
  # GitHub Actions（SHA で固定しているので、更新はここで受け取る）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
